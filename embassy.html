<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script>try{if(localStorage.getItem("dip-theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بوابة الهيئات الدبلوماسية | شرطة دبي</title>
<link rel="icon" href="assets/img/icons/embassy-64.png">
<link rel="manifest" href="embassy.webmanifest">
<link rel="apple-touch-icon" href="assets/img/icons/embassy-180.png">
<meta name="apple-mobile-web-app-title" content="بوابة البعثات">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/embassy.css">
</head>
<body>

<header class="brandbar">
  <div class="in">
    <div class="brand-right">
      <img class="dp light-only" src="assets/img/logo-dubai-police.png" alt="شرطة دبي"><img class="dp dark-only" src="assets/img/logo-dubai-police-white.png" alt="شرطة دبي">
      <span class="sep"></span>
      <img class="acis" src="assets/img/logo-acis.png" alt="ACIS">
      <div class="dept"><b>إدارة أمن الهيئات والمنشآت الحيوية</b><small>AUTHORITIES &amp; CRITICAL INFRASTRUCTURE SECURITY</small></div>
    </div>
    <div class="brand-left"><img class="light-only" src="assets/img/logo-gov-dubai.png" alt="حكومة دبي"><img class="dark-only" src="assets/img/logo-gov-dubai-white.png" alt="حكومة دبي"></div>
  </div>
</header>

<div class="appbar">
  <div class="in">
    <div class="title"><span data-t="portal"></span><span class="tag" data-t="portalTag"></span></div>
    <nav id="nav" hidden>
      <button data-view="home" class="on"><svg class="ic" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span data-t="navHome"></span></button>
      <button data-view="requests"><svg class="ic" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg><span data-t="navReq"></span><span class="cnt" id="updCnt"></span></button>
    </nav>
    <label class="act lang-sel" title="Language"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg><select id="langSel" aria-label="Language"></select></label>
    <div class="who" id="who" hidden></div>
  </div>
</div>
<div id="banner"></div>

<!-- تسجيل الدخول -->
<section id="loginView" class="login-wrap">
  <div class="login card">
    <h1 data-t="loginTitle"></h1>
    <div class="sub" data-t="loginSub"></div>
    <form id="loginForm"></form>
  </div>
</section>

<main id="app" hidden>
  <!-- الرئيسية -->
  <section id="v-home">
    <div class="hero card">
      <div>
        <div class="hello" data-t="welcome"></div>
        <h1 id="missionName"></h1>
        <div class="meta" id="missionMeta"></div>
      </div>
      <button class="sos" id="sosBtn"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3l9.5 16.5h-19L12 3z"/><path d="M12 10v4M12 17.5v.01"/></svg><span><b data-t="sos"></b><small data-t="sosSub"></small></span></button>
    </div>

    <div class="stats" id="myStats"></div>
    <div id="natDay"></div>

    <div class="sec-h"><h2 data-t="catalog"></h2>
      <div class="search"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="svcSearch" class="inp" data-tp="searchSvc"></div>
    </div>
    <div class="cats" id="cats"></div>
    <div class="svc-grid" id="svcGrid"></div>
  </section>

  <!-- طلباتي -->
  <section id="v-requests" hidden>
    <div class="sec-h" style="margin-top:0"><h2 data-t="myReqs"></h2>
      <div class="filters" id="reqFilters"></div>
    </div>
    <div id="reqList" class="req-list"></div>
  </section>
</main>

<footer class="foot">
  <div class="in">
    <div>© 2026 القيادة العامة لشرطة دبي — الإدارة العامة لأمن الهيئات والمنشآت والطوارئ</div>
    <div class="motto">حراسة <i></i> تأمين <i></i> استجابة</div>
  </div>
</footer>

<div class="overlay" id="ov"></div>
<div class="modal" id="modal"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/embassy.js"></script>
<script src="assets/js/brand-fit.js"></script>
</body>
</html>
